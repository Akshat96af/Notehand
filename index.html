<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Notehand — Text to Handwriting</title>
    <meta name="description" content="Type it. Get it in handwriting. Turn text into realistic handwritten notebook pages and export PDF or JPG." />
    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- apply the saved / system appearance before first paint (src/lib/theme.ts) -->
    <script>try{var t=localStorage.getItem('notehand.theme');document.documentElement.dataset.theme=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
    <link rel="preload" href="/fonts/Cursive_real.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
